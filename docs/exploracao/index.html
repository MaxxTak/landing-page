# 01. Overview · Visão Geral e Contexto

> **Spike de Solução:** Landing Page — Sales Costa Advogados  
> **Data:** 2026-08-31  
> **Status:** Concluído / Pronto para Implementação  
> **Referência Metodológica:** Skill `spike-solucao`

---

## 1. Sumário Executivo

Este documento estabelece o **Overview** (Visão Geral e Contexto) da solução proposta para a **Landing Page Institucional do escritório Sales Costa Advogados**. 

O objetivo principal desta spike é avaliar, definir e validar a arquitetura visual, a estrutura de seções, o sistema de design tokens e a stack técnica para a criação de uma **landing page single-page (one-page) de alto padrão de sofisticação**, alinhada à excelência da marca jurídica.

---

## 2. Contexto Atual do Projeto

### 2.1 Estado Atual do Repositório
Atualmente, o projeto possui apenas ativos de identidade visual armazenados no diretório `images/` (logos em variados formatos e paleta cromática oficial). Não há código de marcação, estilização ou lógica pré-existente.

### 2.2 Ativos de Marca Encontrados
- **Wordmark Horizontal:** `images/260701_sales_costa_marca_PREFERENCIAL_temp.png` (Assinatura principal para headers e footers em fundo claro).
- **Assinatura Completa:** `images/260701_sales_costa_marca_ASSINATURA_temp.png` (Versão institucional estendida).
- **Brasão Colorido:** `images/260701_sales_costa_marca_BRASAO_COR_temp.png` (Monograma "S" com acento lima, ideal para favicons e ambientes dark).
- **Brasão Monocromático:** `images/260701_sales_costa_marca_BRASAO_temp.png`.
- **Padrão Cromático Oficial:** `images/260701_sales_costa_marca_PADRAO_CROMATICO_temp.pdf` e `images/paleta_cores.png`.

> [!IMPORTANT]
> Os ativos possuem o sufixo `_temp`, indicando que são provisórios. A arquitetura técnica foi concebida para permitir a substituição transparente desses arquivos sem necessidade de refatoração do código HTML/CSS.

## 3. O Que Está Sendo Avaliado (Escopo da Spike)

Avalia-se a criação de uma presença digital refinada que equilibre **tradição, solidez e modernidade**. Para isso, utilizou-se o benchmarking cruzado de duas referências de mercado:

### 3.1 Benchmark 1: Lefosse (Linguagem Visual & Sofisticação)
- **Tom e Estética:** Escritório *full-service*, estética editorial, uso estratégico de espaço em branco (*whitespace*), tipografia serifada de alto luxo combinada com sans-serif técnica.
- **Interatividade:** Sticky navbar transparente que transiciona suavemente ao scroll para fundo sólido dark (`#53565A`), botões minimalistas com borda sutil e espaçamento de letras (*letter-spacing*).

### 3.2 Benchmark 2: Higasi Sales (Estrutura de Seções One-Page)
- **Navegabilidade:** Estrutura contínua e fluida de navegação por ancoragem em página única.
- **Seções Mapeadas:** Hero Banner, Sobre o Escritório, Áreas de Atuação, Diferenciais, Em Números, Depoimentos, Nossa Equipe, Fale Conosco e Rodapé.

---

## 4. Decisão de Stack Técnica

### 4.1 Comparativo de Arquitetura

| Critério | Opção A: HTML5 / CSS3 / Vanilla JS (Recomendada) | Opção B: Next.js / React / TailwindCSS |
|---|---|---|
| **Dependências de Build** | Zero (Executa nativamente no navegador) | Altas (Node.js, npm, Webpack/Turbopack, node_modules) |
| **Performance (Lighthouse)** | Nativa 98-100 (Sem overhead de JS runtime) | 80-90 (Requer otimização cuidadosa de bundle) |
| **Manutenibilidade** | Extremamente simples (Qualquer dev HTML/CSS edita) | Requer conhecimento em Framework React/Next |
| **Custo de Hospedagem** | Gratuito / Qualquer servidor estático (GitHub Pages/Netlify) | Requer Serverless/Node.js host se houver SSR/ISR |
| **Complexidade** | Mínima (Adequada para landing page estática) | Sobredimensionada para o escopo atual |

### 4.2 Decisão Final
Adoptou-se a **Opção A (HTML5 / Vanilla CSS / Vanilla JS)**. A escolha garante máxima performance de carregamento, independência de ferramentas de build complexas, facilidade de implantação e controle absoluto sobre as animações e design tokens.

## 2. Fluxos Interativos de Javascript

### 2.1 Fluxo da Sticky Navbar

```javascript
// main.js - Gerenciamento de estado da Navbar ao rolar a página
const navbar = document.querySelector('.navbar');
const SCROLL_THRESHOLD = 80;

window.addEventListener('scroll', () => {
  if (window.scrollY > SCROLL_THRESHOLD) {
    navbar.classList.add('scrolled');
  } else {
    navbar.classList.remove('scrolled');
  }
}, { passive: true });
```

### 2.2 Fluxo de Smooth Scroll por Âncoras

```javascript
// Navegação suave com offset para compensar a altura da navbar fixa (80px)
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
  anchor.addEventListener('click', function (e) {
    e.preventDefault();
    const targetId = this.getAttribute('href');
    if (targetId === '#') return;
    
    const targetElement = document.querySelector(targetId);
    if (targetElement) {
      const headerOffset = 80;
      const elementPosition = targetElement.getBoundingClientRect().top;
      const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

      window.scrollTo({
        top: offsetPosition,
        behavior: 'smooth'
      });
    }
  });
});
```

### 2.3 Fluxo do Intersection Observer (Animação ao Scroll)

```javascript
// animations.js - Revelação progressiva dos elementos
const observerOptions = {
  root: null,
  rootMargin: '0px 0px -60px 0px',
  threshold: 0.15
};

const revealObserver = new IntersectionObserver((entries, observer) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('is-visible');
      observer.unobserve(entry.target); // Anima apenas na primeira entrada
    }
  });
}, observerOptions);

document.querySelectorAll('[data-animate]').forEach(el => revealObserver.observe(el));
```

```css
/* Respeito à preferência de redução de movimento do sistema operacional */
@media (prefers-reduced-motion: reduce) {
  [data-animate] {
    opacity: 1 !important;
    transform: none !important;
    transition: none !important;
  }
}
```

### 2.4 Fluxo do Contador Animado ("Em Números")

```javascript
function animateCounters() {
  const counters = document.querySelectorAll('.counter-number');
  const speed = 200; // Duração total aproximada em ms

  counters.forEach(counter => {
    const updateCount = () => {
      const target = +counter.getAttribute('data-target');
      const count = +counter.innerText;
      const inc = target / speed;

      if (count < target) {
        counter.innerText = Math.ceil(count + inc);
        setTimeout(updateCount, 15);
      } else {
        counter.innerText = target;
      }
    };
    updateCount();
  });
}
```

|---|---|---|---|---|---|
| **R01** | Ausência de definição do serviço de backend para envio de e-mails do formulário de contato | Técnico / Integração | Alta | Alto | Utilizar serviço *serverless* terceirizado sem backend próprio (ex: Formspree, EmailJS ou Resend) ou integrar via API WhatsApp Web como fallback temporário. |
| **R02** | Imagens e marcas atuais possuem sufixo `_temp` e podem sofrer alteração de proporção | Design / Marca | Média | Médio | Manter os caminhos de imagens em variáveis/CSS e usar containers com `object-fit: contain` e dimensões relativas. |
| **R03** | Latência no carregamento de fontes externas (Google Fonts) em conexões lentas | Performance | Baixa | Médio | Implementar `<link rel="preconnect">`, utilizar `font-display: swap` e prever fallbacks de fontes do sistema (`Georgia`, `serif`, `Arial`). |
| **R04** | Ausência de fotos profissionais em alta resolução da equipe de advogados | Conteúdo | Alta | Médio | Desenvolver os cards de equipe com suporte a avatares/silhuetas estilizadas com as cores da marca enquanto o ensaio fotográfico não é concluído. |
| **R05** | Incompatibilidade com navegadores legados (ex: Internet Explorer) | Compatibilidade | Baixa | Baixo | Utilizar propriedades CSS3 modernas com fallbacks padrão e JavaScript ES6 compilado ou compatível com navegadores evergreen. |

---

## 2. Perguntas em Aberto (Fila de Decisões)

> [!WARNING]
> Os pontos abaixo precisam de definição antes ou durante as fases iniciais de desenvolvimento.

### 2.1 Backend e Envio de E-mails
1. Qual será a ferramenta de recebimento das mensagens do formulário? (Formspree, EmailJS, Webhook N8N/Make, ou e-mail corporativo via SMTP?)
2. Haverá redirecionamento automático para o WhatsApp Business do escritório ao enviar a mensagem?

### 2.2 Conteúdo e Mídia
1. Quais são as 6 áreas de atuação prioritárias a serem exibidas na versão inicial da landing page?
2. Quantos sócios/advogados integrarão a seção "Nossa Equipe" e quais suas descrições e números OAB?
3. Os números apresentados na seção "Em Números" (anos de experiência, clientes, casos) já foram validados pela diretoria do escritório?

### 2.3 Hospedagem e Infraestrutura
1. Qual será a plataforma de hospedagem de destino? (Vercel, Netlify, GitHub Pages, cPanel/Hostgator do cliente?)
2. O domínio `salescosta.com.br` já está registrado e configurado com suporte a HTTPS/SSL?

## 3. Mapeamento de Dependências Externas

1. **Google Fonts CDN:** Carregamento das famílias `Cormorant Garamond` e `DM Sans`.
2. **Serviço de Formulário:** Dependência de endpoint HTTPS para recebimento dos dados do formulário sem exposição de credenciais de e-mail.
3. **Ativos de Marca:** Troca dos arquivos PNG `_temp` pelos vetores finais em SVG assim que fornecidos pelo time de branding.

## 1. Objetivos do Projeto (Goals)

O escopo principal contemplado nesta solução inclui:

- [x] **Identidade Visual Fiel e Elegante:** Implementar uma landing page que traduza a identidade corporativa do escritório Sales Costa Advogados utilizando as cores oficiais (Taupe `#AA9B8F`, Cinza Chumbo `#53565A`, Lima `#E4FF8F`) e tipografia refinada (`Cormorant Garamond` e `DM Sans`).
- [x] **Arquitetura One-Page Fluida:** Estruturar uma única página com 10 seções altamente coesas e navegação por ancoragem sem recarregamento da página.
- [x] **Sticky Navbar Inteligente:** Desenvolver barra de navegação responsiva com alteração de background ao scroll (transparente para dark).
- [x] **Interações e Micro-Animações:** Incorporar animações de entrada ao scroll (*reveal on scroll* via Intersection Observer), contadores numéricos animados e carousel de depoimentos.
- [x] **Design Totalmente Responsivo:** Garantir adaptação perfeita em dispositivos móveis (320px), tablets (768px) e monitores wide (1280px+).
- [x] **Alta Performance e SEO Nativo:** Construir uma solução leve (HTML/CSS/JS Vanilla) que alcance nota máxima nos testes de performance do Google Lighthouse e suporte tags Open Graph/meta SEO.

---

## 2. Não-Objetivos (Not Goals / Fora de Escopo da V1)

Para evitar desvio de escopo (*scope creep*), os seguintes itens estão **explicitamente fora do escopo desta versão**:

- [ ] **Desenvolvimento de Painel CMS / Gestor de Conteúdo:** Não haverá painel administrativo nesta fase (conteúdo é estático e gerenciado via código).
- [ ] **Blog Corporativo ou Área de Artigos:** Módulos de notícias ou artigos jurídicos não fazem parte do MVP.
- [ ] **Suporte Multi-Idioma (i18n):** A versão inicial será entregue exclusivamente em Língua Portuguesa (PT-BR).
- [ ] **Área de Cliente / Portal Restrito:** Não haverá sistema de autenticação, login de clientes ou consulta de processos.
- [ ] **Redesenho de Marcas ou Logos:** A spike utiliza as imagens provisórias existentes e não prevê alteração na identidade gráfica oficial da marca.

---

## 3. Mapeamento de User Stories

| Código | História de Usuário (User Story) | Seção Relacionada |
|---|---|---|
| **US-01** | Como potencial cliente, quero visualizar imediatamente o posicionamento do escritório no Hero Banner para entender a proposta de valor. | Hero Banner |
| **US-02** | Como visitante, quero navegar pelas seções da página através de links de ancoragem na navbar para acessar dados específicos rapidamente. | Navbar Sticky |
| **US-03** | Como cliente corporativo, quero conhecer a história e os valores do escritório para avaliar sua reputação e autoridade. | Sobre o Escritório |
| **US-04** | Como visitante, quero visualizar a lista de áreas de atuação com descrições objetivas para saber se o escritório atende à minha necessidade. | Áreas de Atuação |

| **US-06** | Como potencial cliente, quero consultar o perfil dos advogados e sócios para identificar a equipe responsável. | Nossa Equipe |
| **US-07** | Como usuário em dispositivo móvel, quero enviar uma mensagem pelo formulário de contato simplificado sem sair da página. | Fale Conosco |
| **US-08** | Como visitante, quero acessar os canais oficiais de comunicação e redes sociais no rodapé da página. | Rodapé |

<script>
const NAV = [{"section": "Documentação do Spike", "items": [{"id": "spike-salescosta-01-overview", "title": "01 · Overview", "path": "spike-salescosta/01-overview.md"}, {"id": "spike-salescosta-02-model", "title": "02 · Model", "path": "spike-salescosta/02-model.md"}, {"id": "spike-salescosta-03-flows", "title": "03 · Flows", "path": "spike-salescosta/03-flows.md"}, {"id": "spike-salescosta-04-risks", "title": "04 · Risks", "path": "spike-salescosta/04-risks.md"}, {"id": "spike-salescosta-05-goals-and-not-goals", "title": "05 · Goals & Not Goals", "path": "spike-salescosta/05-goals-and-not-goals.md"}, {"id": "spike-salescosta-06-visual-layout", "title": "06 · Visual Layout", "path": "spike-salescosta/06-visual-layout.md"}, {"id": "spike-salescosta-07-tasks", "title": "07 · Tasks & Roadmap", "path": "spike-salescosta/07-tasks.md"}]}];
const FLAT = NAV.flatMap(s => s.items);
const navEl = document.getElementById('nav');
NAV.forEach(s => {
  const h = document.createElement('div'); h.className = 'sec'; h.textContent = s.section;
  navEl.appendChild(h);
  s.items.forEach(it => {
    const a = document.createElement('a');
    a.href = '#' + it.id; a.textContent = it.title; a.dataset.id = it.id;
    navEl.appendChild(a);
  });
});

const MD_OK = typeof marked !== 'undefined';
if (MD_OK) marked.setOptions({ gfm: true, breaks: false });
const render = raw => MD_OK
  ? marked.parse(raw)
  : '<p style="color:#b45309">Sem conexão CDN. Conteúdo bruto abaixo.</p><pre></pre>';

let mermaidReady = false;
window.addEventListener('mermaid-ready', () => { mermaidReady = true; renderMermaid(); });

function renderMermaid(){
  if(!mermaidReady) return;
  const nodes = document.querySelectorAll('#doc .mermaid:not([data-done])');
  if(!nodes.length) return;
  nodes.forEach(n => n.setAttribute('data-done','1'));
  window.mermaid.run({ nodes: [...nodes] });
}

function show(id){
  const idx = FLAT.findIndex(x => x.id === id);
  const item = idx >= 0 ? FLAT[idx] : FLAT[0];
  const docEl = document.getElementById('doc');

  const raw = document.getElementById(item.id).textContent;
  docEl.innerHTML = render(raw);
  if (!MD_OK) docEl.querySelector('pre').textContent = raw;

  docEl.querySelectorAll('pre > code.language-mermaid').forEach(code => {
    const d = document.createElement('div');
    d.className = 'mermaid';
    d.textContent = code.textContent;
    code.parentElement.replaceWith(d);
  });

  docEl.querySelectorAll('table').forEach(t => {
    const w = document.createElement('div'); w.className = 'tablewrap';
    t.replaceWith(w); w.appendChild(t);
  });

  document.getElementById('crumb').textContent = item.path;
  document.querySelectorAll('#nav a').forEach(a =>
    a.classList.toggle('active', a.dataset.id === item.id));

  const i = FLAT.indexOf(item);
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  if(i > 0){ prev.href = '#' + FLAT[i-1].id; prev.textContent = '← ' + FLAT[i-1].title; }
  else { prev.removeAttribute('href'); prev.textContent = ''; }
  if(i < FLAT.length-1){ next.href = '#' + FLAT[i+1].id; next.textContent = FLAT[i+1].title + ' →'; }
  else { next.removeAttribute('href'); next.textContent = ''; }

  document.title = item.title.replace(/^[\d\s·]+/, '') + ' · Spike';
  window.scrollTo(0, 0);
  document.getElementById('side').classList.add('collapsed');
  renderMermaid();
}

document.getElementById('burger').onclick = () =>
  document.getElementById('side').classList.toggle('collapsed');

document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if(!a || (!a.closest('#nav') && !a.closest('.navfoot'))) return;
  e.preventDefault();
  const id = a.getAttribute('href').slice(1);
  if(location.hash.slice(1) === id) show(id);
  else location.hash = '#' + id;
});

window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1) || FLAT[0].id);
</script>
</body>
</html>
