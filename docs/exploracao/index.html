<script type="text/plain" id="spike-salescosta-01-overview">
# 01. Overview · Visão Geral e Contexto

> **Spike de Solução:** Landing Page — Sales Costa Advogados  
> **Data:** 2026-09-01  
> **Status:** Atualizado conforme Layout Oficial com Diretriz Estrita de Responsividade Universal ([sales-costa-layout-previa.png](../images/sales-costa-layout-previa.png))  
> **Referência Metodológica:** Skill `spike-solucao`

---

## 1. Sumário Executivo

Este documento estabelece o **Overview** (Visão Geral e Contexto) da solução proposta para a **Landing Page Institucional do escritório Sales Costa Advogados**, atualizado com base no **design oficial de referência** ([images/sales-costa-layout-previa.png](../images/sales-costa-layout-previa.png)).

O objetivo principal desta spike é avaliar, definir e validar a arquitetura visual, a estrutura exata das 11 seções, o sistema de design tokens, a stack técnica e a **garantira incondicional de responsividade universal**, assegurando que a aplicação seja totalmente utilizável em **todos os tipos de dispositivos** (smartphones de 320px, phablets, tablets, laptops, monitores 4K e telas dobráveis) **sem qualquer quebra de layout**.

---

## 2. Diretriz Estrita de Responsividade Universal

A arquitetura da landing page adota a abordagem **Mobile-First** com adaptação fluida contínua. 

### Princípios Inegociáveis de Responsividade:
- **Zero Overflow Horizontal:** Aplicação estrita de `overflow-x: hidden; width: 100%` impedindo qualquer rolagem lateral indesejada.
- **Tipografia e Espaçamentos Fluidos:** Utilização de funções CSS `clamp()`, unidades relativas (`rem`, `vw`) e grids flexíveis.
- **Áreas de Toque Confortáveis:** Alvos de clique e toque com dimensões mínimas de $44 \times 44\text{px}$ em telas sensíveis ao toque.
- **Prevenção de Zoom Indesejado:** Entradas de formulário com `font-size: 16px` para evitar zoom automático em navegadores móveis (iOS Safari).
- **Adaptabilidade Fluida por Breakpoint:** Redimensionamento inteligente dos 10 componentes em telas pequenas (320px–480px), médias (768px–1023px) e grandes (1024px+).

---

## 3. Estrutura Oficial de Seções da Landing Page

A partir do layout de referência ([sales-costa-layout-previa.png](../images/sales-costa-layout-previa.png)), a landing page está dividida em **11 seções navegáveis**:

1. **Navbar Sticky:** Marca `SALES COSTA` + Links `Comunicado` | `Sobre` | `Áreas` | `Diferenciais` | `Equipe` | `Fale conosco` (Menu drawer no mobile).
2. **Hero Banner:** Headline *"Junto nas decisões que constroem o futuro."* + Subtítulo + CTAs *"Conheça o escritório →"* e *"Fale conosco →"* + Indicador de scroll.
3. **Comunicado ao Mercado:** Seção dark institucional sobre a união de Dilson Higasi Sales e Rodrigo Moreira da Costa, com citações dos sócios-fundadores e marca d'água "S" decorativa.
4. **Sobre o Escritório:** *"Uma trajetória construída sobre confiança e critério técnico."* + 3 parágrafos de apresentação + 3 pilares (*Comprometimento*, *Confidencialidade*, *Excelência*).
5. **Áreas de Atuação:** Grid 2x3 com 6 especialidades (*Empresarial*, *Tributário*, *Trabalhista*, *Civil*, *Societário*, *Compliance & Governança*), colapsável para 1 coluna no mobile.
6. **Por Que Sales Costa (Diferenciais):** Ambiente dark `#404347` com 4 diferenciais adaptáveis para exibição empilhada em smartphones.
7. **Em Números:** Banner claro com métricas (*15+ Anos*, *500+ Clientes*, *300+ Casos*, *5 Áreas*) em grid 2x2 no mobile.
8. **Depoimentos:** Citação de cliente (*Marina Albuquerque, Diretora Financeira do Grupo Vantis*) + navegação por dots com suporte a touch swipe.
9. **Nossa Equipe:** Grid de 4 sócios (*Antônio Sales*, *Camila Costa*, *Felipe Ramos*, *Luisa Martins*) com avatares responsivos.
10. **Fale Conosco:** Formulário minimalista + Endereço (*Av. Paulista, 1000 — 12º andar, São Paulo/SP*), e-mail, telefone e redes sociais.
11. **Rodapé Institucional:** Logo e links com alinhamento vertical em telas pequenas.

---

## 4. Decisão de Stack Técnica

Adotou-se **HTML5 Semântico / Vanilla CSS3 / Vanilla JS (ES6+)**. A escolha garante 100% de alinhamento com a alta performance e fidelidade visual do layout oficial, sem dependência de frameworks ou ferramentas pesadas de build.

## 3. Fluxos Interativos de JavaScript

### 3.1 Prevenção de Zoom em Navegadores Mobile (iOS Safari)
```javascript
// main.js - Garantia de tamanho mínimo de fonte para inputs móveis
document.querySelectorAll('input, select, textarea').forEach(input => {
  input.style.fontSize = '16px'; // Impede o zoom automático de tela no iOS
});
```

### 3.2 Suporte a Gestos Táteis no Carousel de Depoimentos (Touch Swipe)
```javascript
// Suporte a swipe em dispositivos móveis
let touchstartX = 0;
let touchendX = 0;

const carousel = document.querySelector('.testimonials-carousel');
if (carousel) {
  carousel.addEventListener('touchstart', e => {
    touchstartX = e.changedTouches[0].screenX;
  }, { passive: true });

  carousel.addEventListener('touchend', e => {
    touchendX = e.changedTouches[0].screenX;
    handleGesture();
  }, { passive: true });
}

function handleGesture() {
  if (touchendX < touchstartX - 50) nextSlide();
  if (touchendX > touchstartX + 50) prevSlide();
}
```

# 04. Risks · Riscos, Dependências & Perguntas em Aberto

> **Spike de Solução:** Landing Page — Sales Costa Advogados  
> **Data:** 2026-09-01  
> **Status:** Atualizado conforme Layout Oficial ([sales-costa-layout-previa.png](../images/sales-costa-layout-previa.png))

---

## 1. Matriz de Riscos Técnicos e de Negócio

| ID | Risco Identificado | Categoria | Probabilidade | Impacto | Estratégia de Mitigação |
|---|---|---|---|---|---|
| **R01** | Ausência de definição do serviço de backend para envio do formulário de contato | Técnico | Alta | Alto | Utilizar serviço *serverless* terceirizado (Formspree/EmailJS) enviando para `contato@salescosta.com.br` ou fallback via WhatsApp API. |
| **R02** | Fotografias reais dos sócios (AS, CC, FR, LM) ainda não foram tiradas | Conteúdo | Média | Médio | Manter a solução inteligente prevista no layout oficial: placeholders elegantes com iniciais (*AS*, *CC*, *FR*, *LM*) sobre fundo bege `#F8F6F4`. |
| **R03** | Números da OAB nos cards da equipe constam como `OAB/SP 000.000` | Conteúdo | Baixa | Baixo | Substituir pelas inscrições OAB oficiais dos sócios antes da publicação final. |
| **R04** | Formatos de imagem PNG `_temp` para logos | Marca | Baixa | Baixo | Ativos parametrizados via CSS/HTML permitindo substituição transparente por vetores SVG. |

---

<script type="text/plain" id="spike-salescosta-prds-us-01-hero-banner">
# PRD — US-01: Hero Banner & Proposta de Valor

> **Origem:** US-01 em [05-goals-and-not-goals.md](../05-goals-and-not-goals.md)  
> **Componente:** Componente 1 em [06-visual-layout.md](../06-visual-layout.md)  
> **Status:** Pronta para Desenvolvimento

---

## 1. Contexto e Problema

### 1.1 Contexto
Ao acessar o portal institucional da banca Sales Costa Advogados, o visitante (potencial cliente corporativo ou parceiro) precisa identificar imediatamente o posicionamento do escritório, sua reputação e autoridade no mercado jurídico sem necessitar de busca prolongada.

### 1.2 Problema
Páginas iniciais genéricas sem clareza de mensagem ou com tempo de carregamento elevado geram dispersão, perda de interesse e alta taxa de rejeição (*bounce rate*).

### 1.3 Persona Afetada
- **Diretores Executivos, CFOs, Gerentes Jurídicos e Famílias com Gestão Patrimonial** buscando assessoria de alta complexidade.

---

## 2. Objetivos

- **O01:** Apresentar a proposta de valor principal do escritório nos primeiros 3 segundos de visualização da página.
- **O02:** Disponibilizar chamadas para ação (CTAs) diretas e visíveis em qualquer resolução de tela (320px a 2560px).

---

## 3. Métricas de Sucesso

- **M01:** Taxa de retenção no topo da página (*Above-the-fold engagement*) $> 80\%$.
- **M02:** Clique nos botões CTA (*Conheça o escritório* e *Fale conosco*) $> 12\%$ dos acessos totais.
- **M03:** Tempo de carregamento da Hero Banner (First Contentful Paint) $< 1.5\text{s}$.

---

## 4. Solução Proposta

Desenvolvimento da **Hero Section** institucional em fundo dark (`#484B4F` / `#404347`), apresentando a eyebrow tag `"SALES COSTA ADVOGADOS"`, a headline principal H1 em alto impacto visual (*"Junto nas decisões que constroem o futuro."*), o subtítulo de posicionamento corporativo, a dupla de botões CTA interativos com indicação vetorial e o elemento animado de indução ao scroll.

---

## 5. Handoff de Design

- **Layout de Referência:** [sales-costa-layout-previa.png](../../images/sales-costa-layout-previa.png)
- **Componente Visual:** `images/components/01_navbar_hero.png`
- **Esquema de Cores:** Fundo Dark Charcoal `#404347`, Eyebrow Taupe `#AA9B8F`, Texto Branco `#FFFFFF`.
- **Tipografia:** Eyebrow `DM Sans 500` (12px, `letter-spacing: 4px`), H1 `DM Sans` / `Cormorant Garamond` (`font-size: clamp(2rem, 5vw, 4rem)`).
- **Responsividade:** CTAs alinhados horizontalmente no desktop; empilhados em 1 coluna full width no mobile (`< 1024px`).

---

## 6. Regras de Negócio

- **RN-01:** O H1 deve permanecer visível e legível em todos os tamanhos de viewport sem sobreposição de caixas.
- **RN-02:** O botão *"Fale conosco →"* deve direcionar o scroll suave até a seção `#contato`.
- **RN-03:** O botão *"Conheça o escritório →"* deve direcionar o scroll suave até a seção `#sobre`.
- **RN-04:** O elemento animado de scroll deve indicar a continuidade da página e rolar suavemente ao ser clicado.

---

## 7. Critérios de Aceitação (Testáveis)

### CA-01: Exibição da Headline e Subtítulo
- **Dado** que o usuário acessa a landing page no desktop ou mobile,
- **Quando** a Hero Section é carregada,
- **Então** o texto H1 *"Junto nas decisões que constroem o futuro."* deve ser exibido com destaque e sem quebras de layout.

### CA-02: Interatividade dos Botões CTA
- **Dado** que o usuário clica no botão *"Fale conosco →"*,
- **Quando** a ação de clique/toque ocorre,
- **Então** a página rola suavemente até o formulário da seção `#contato` compensando o offset da navbar (80px).

### CA-03: Responsividade dos CTAs no Mobile
- **Dado** um viewport com largura $< 1024\text{px}$,
- **Quando** a Hero Banner é renderizada,
- **Então** os botões CTA são empilhados em 1 coluna com alvos de toque $\ge 44\times 44\text{px}$.

---

## 8. Fora de Escopo e Riscos

### Fora de Escopo
- Vídeos de fundo ou carrossel de imagens na hero section (foco em minimalismo e performance estática).

### Riscos
- **Risco:** Lentidão no carregamento da fonte serifada via CDN.
- **Mitigação:** Uso de `<link rel="preconnect">` e `font-display: swap`.

</script>

<script type="text/plain" id="spike-salescosta-prds-us-02-comunicado-ao-mercado">
# PRD — US-02: Comunicado ao Mercado (União das Bancas)

> **Origem:** US-02 em [05-goals-and-not-goals.md](../05-goals-and-not-goals.md)  
> **Componente:** Componente 2 em [06-visual-layout.md](../06-visual-layout.md)  
> **Status:** Pronta para Desenvolvimento

---

## 1. Contexto e Problema

### 1.1 Contexto
A nova marca **Sales Costa Advogados** é fruto da união estratégica entre a **Higasi Sales Advogados** e **Rodrigo Moreira da Costa**. Mercado, clientes existentes e parceiros comerciais precisam entender a evolução institucional, a fusão de expertises e os valores que fundamentam o nascimento da banca.

### 1.2 Problema
A ausência de uma declaração institucional clara sobre a origem da nova marca pode gerar dúvidas em clientes atuais sobre a continuidade dos serviços e a composição societária.

### 1.3 Persona Afetada
- Clientes ativos da Higasi Sales, novos clientes empresariais, mercado jurídico e veículos de imprensa.

---

## 2. Objetivos

- **O01:** Comunicar formalmente a união dos sócios-fundadores Dilson Higasi Sales e Rodrigo Moreira da Costa.
- **O02:** Apresentar a visão integrada de atendimento Cobrindo São Paulo e Florianópolis nas áreas tributária, societária, cível, imobiliária e trabalhista.

---

## 3. Métricas de Sucesso

- **M01:** Leitura completa do comunicado (tempo médio na seção $> 45\text{s}$).
- **M02:** Redução a zero de dúvidas sobre a transição de marca por clientes antigos.

---

## 4. Solução Proposta

Desenvolvimento de uma seção institucional em fundo dark (`#404347`), destacando o eyebrow em tom Lima (`#E4FF8F`), o titular sobre a fundação do Sales Costa Advogados, a marca d'água "S" decorativa e a publicação dos 5 parágrafos oficiais com as citações dos fundadores.

---

## 5. Handoff de Design

- **Layout de Referência:** [sales-costa-layout-previa.png](../../images/sales-costa-layout-previa.png)
- **Componente Visual:** `images/components/02_comunicado.png`
- **Esquema de Cores:** Fundo Dark `#404347`, Eyebrow Lima `#E4FF8F`, Texto Cinza Claro `#D1D5DB`.
- **Marca d'água:** Monograma "S" posicionado à direita no desktop (opacidade 5%, `z-index: 0`).
- **Responsividade:** Container de texto max-width 860px no desktop; largura 100% com padding 20px no mobile; marca d'água atua como overlay sutil no fundo em telas pequenas.

---

## 6. Regras de Negócio

- **RN-01:** O texto do comunicado deve ser exatamente o aprovado pelos sócios-fundadores, sem alterações na declaração oficial.
- **RN-02:** As citações de Dilson Higasi Sales e Rodrigo Moreira da Costa devem possuir destaque tipográfico.
- **RN-03:** A marca d'água "S" nunca deve comprometer a taxa de contraste de leitura do texto (WCAG AAA).

---

## 7. Critérios de Aceitação (Testáveis)

### CA-01: Exibição do Texto do Comunicado
- **Dado** que o visitante navega até a seção `#comunicado`,
- **Quando** o conteúdo é renderizado,
- **Então** os 5 parágrafos institucionais e as citações dos sócios são exibidos com legibilidade em fundo `#404347`.

### CA-02: Comportamento Responsivo no Mobile
- **Dado** um smartphone com largura de 320px,
- **Quando** o comunicado é visualizado,
- **Então** o texto ajusta-se com padding lateral de 20px sem causar rolagem horizontal.

---

## 8. Fora de Escopo e Riscos

### Fora de Escopo
- Módulo de comentários ou compartilhamento social na seção de comunicado.

### Riscos
- **Risco:** Texto extenso causar fadiga visual em smartphones.
- **Mitigação:** Tipografia com `line-height: 1.65` e espaçamento entre parágrafos de 20px.

</script>

# PRD — US-03: Sobre o Escritório & Pilares Estratégicos

> **Origem:** US-03 em [05-goals-and-not-goals.md](../05-goals-and-not-goals.md)  
> **Componente:** Componente 3 em [06-visual-layout.md](../06-visual-layout.md)  
> **Status:** Pronta para Desenvolvimento

---

## 1. Contexto e Problema

### 1.1 Contexto
Clientes empresariais que buscam contratação de serviços jurídicos de alto valor necessitam de provas claras sobre os princípios de atuação, o histórico de experiência e o modelo de relacionamento do escritório antes de tomar a decisão de contato.

### 1.2 Problema
Apresentações institucionais longas e prolixas sem pilares objetivos geram desconfiança sobre a verdadeira capacidade técnica e ética do escritório.

### 1.3 Persona Afetada
- Diretores, empresários, investidores e famílias de alta renda.

---

## 2. Objetivos

- **O01:** Apresentar a trajetória de mais de 15 anos do escritório com foco em confiança e critério técnico.
- **O02:** Destacar os 3 pilares de atuação: *Comprometimento*, *Confidencialidade* e *Excelência*.

---

## 3. Métricas de Sucesso

- **M01:** Taxa de leitura da seção Sobre $> 70\%$.
- **M02:** Índice de clareza percebida nos pilares em pesquisas com clientes $> 90\%$.

---

## 4. Solução Proposta

Desenvolvimento da seção *"Sobre o Escritório"* em fundo Off-White Quente (`#F8F6F4`), disposta em 2 colunas no desktop (40% para o H2 *"Uma trajetória construída sobre confiança e critério técnico."* e 60% para o texto introdutório e os 3 pilares estruturados).

---

## 5. Handoff de Design

- **Layout de Referência:** [sales-costa-layout-previa.png](../../images/sales-costa-layout-previa.png)
- **Componente Visual:** `images/components/03_sobre.png`
- **Esquema de Cores:** Fundo Off-White `#F8F6F4`, Texto Dark `#2B2B2B`, Linha Divisória Taupe `#D9D3CE`.
- **Pilares:**
  - **Comprometimento:** *Disponibilidade real com cada cliente e cada causa.*
  - **Confidencialidade:** *Sigilo absoluto sobre informações estratégicas.*
  - **Excelência:** *Rigor técnico em cada peça, parecer e negociação.*
- **Responsividade:** Grid de 2 colunas no desktop que migra para 1 coluna vertical empilhada no mobile (`< 768px`) com divisores horizontais.

---

## 6. Regras de Negócio

- **RN-01:** Os 3 pilares devem possuir destaque em negrito e descrição curta em itálico/subtítulo.
- **RN-02:** No mobile, os pilares devem empilhar verticalmente mantendo espaçamento mínimo de `16px` entre cartões.

---

## 7. Critérios de Aceitação (Testáveis)

### CA-01: Exibição dos Pilares Estratégicos
- **Dado** que o visitante visualiza a seção `#sobre`,
- **Quando** a seção é renderizada,
- **Então** os 3 pilares (*Comprometimento*, *Confidencialidade*, *Excelência*) são exibidos com suas descrições associadas.

### CA-02: Adaptação Responsiva 1 Coluna no Mobile
- **Dado** um dispositivo com largura $< 768\text{px}$,
- **Quando** a seção Sobre é acessada,
- **Então** o layout colapsa para 1 coluna vertical sem estouro de texto.

---

## 8. Fora de Escopo e Riscos

### Fora de Escopo
- Linha do tempo interativa ano a ano (mantida a apresentação simplificada em parágrafos e pilares).

### Riscos
- N/A.

<script type="text/plain" id="spike-salescosta-prds-us-04-areas-de-atuacao">
# PRD — US-04: Áreas de Atuação (Grid de Especialidades)

> **Origem:** US-04 em [05-goals-and-not-goals.md](../05-goals-and-not-goals.md)  
> **Componente:** Componente 4 em [06-visual-layout.md](../06-visual-layout.md)  
> **Status:** Pronta para Desenvolvimento

---

## 1. Contexto e Problema

### 1.1 Contexto
Visitantes corporativos acessam o portal para confirmar se o escritório possui capacidade técnica e especialização direta na área jurídica específica de seu interesse.

### 1.2 Problema
Apresentar áreas de atuação em listas de texto simples sem ícones ou descrições dificulta a navegação rápida e reduz a percepção de especialização do escritório.

### 1.3 Persona Afetada
- Gestores jurídicos, diretores administrativos, CFOs e empreendedores.

---

## 2. Objetivos

- **O01:** Exibir de forma visualmente organizada e categorizada as 6 especialidades jurídicas do escritório.
- **O02:** Permitir o acesso imediato à síntese descritiva de cada área com chamadas de interatividade (*Saiba mais →*).

---

## 3. Métricas de Sucesso

- **M01:** Interação com os cards de especialidades (hover/touch) em $> 40\%$ dos acessos.
- **M02:** Identificação imediata da área de interesse em $< 5\text{s}$.

---

## 4. Solução Proposta

Desenvolvimento de um grid de cards responsivo (3 colunas no desktop, 2 no tablet, 1 no mobile) em fundo Branco Puro (`#FFFFFF`), exibindo as 6 áreas de atuação:
1. **Direito Empresarial:** Estruturação societária, contratos comerciais e assessoria contínua.
2. **Direito Tributário:** Planejamento fiscal, consultoria preventiva e defesa.
3. **Direito Trabalhista:** Gestão de risco trabalhista, compliance de RH e representação.
4. **Direito Civil:** Contratos, responsabilidade civil e patrimônio.
5. **Direito Societário:** Fusões, aquisições, governança e reestruturação.
6. **Compliance & Governança:** Programas de integridade e auditoria de conformidade.

---

## 5. Handoff de Design

- **Layout de Referência:** [sales-costa-layout-previa.png](../../images/sales-costa-layout-previa.png)
- **Componente Visual:** `images/components/04_areas.png`
- **Esquema de Cores:** Fundo Branco `#FFFFFF`, Ícones em tom Taupe `#AA9B8F`, Borda de Hover em Taupe.
- **Responsividade:** Desktop `repeat(3, 1fr)`; Tablet `repeat(2, 1fr)`; Mobile `1fr` empilhado. Links *Saiba mais →* com alvo tátil $\ge 44\text{px}$.

---

## 6. Regras de Negócio

- **RN-01:** Cada card deve conter obrigatoriamente: Ícone SVG em linha fina, Título em DM Sans 500, Breve Descrição e Link interativo *"Saiba mais →"*.
- **RN-02:** O passar do cursor (hover no desktop ou toque no mobile) deve elevar visualmente o card com uma borda inferior em tom Taupe `#AA9B8F`.

---

## 7. Critérios de Aceitação (Testáveis)

### CA-01: Renderização dos 6 Cards de Especialidades
- **Dado** que o usuário acessa a seção `#areas`,
- **Quando** a seção carrega,
- **Então** os 6 cards (*Empresarial*, *Tributário*, *Trabalhista*, *Civil*, *Societário*, *Compliance*) são exibidos com ícone, título, descrição e botão.

### CA-02: Reordenamento Automático no Mobile
- **Dado** um viewport móvel com largura de 375px,
- **Quando** a seção é exibida,
- **Então** os cards são organizados em 1 coluna vertical sem estouro de margens.

---

## 8. Fora de Escopo e Riscos

### Fora de Escopo
- Modais com artigos jurídicos completos por área (links de *Saiba mais* direcionam ao formulário de contato ou scroll).

### Riscos
- N/A.

</script>

# PRD — US-05: Por Que Sales Costa (Diferenciais de Atendimento)

---

## 1. Contexto e Problema

### 1.1 Contexto
Em um mercado jurídico altamente competitivo, demonstrar diferenciais concretos de atendimento e metodologia de acompanhamento é essencial para converter a intenção do visitante em contato direto.

### 1.2 Problema
Escritórios de advocacia frequentemente utilizam jargões genéricos ("qualidade", "agilidade") sem detalhar como o acompanhamento do caso é de fato executado.

### 1.3 Persona Afetada
- Clientes corporativos em busca de atendimento direto e transparente pelos sócios.

- **M02:** Aumento na percepção de valor e transparência corporativa.

1. **Atendimento personalizado:** Acompanhamento direto pelos sócios responsáveis.

---

## 6. Regras de Negócio

- **RN-01:** Os 4 diferenciais devem possuir o mesmo peso visual e alinhamento vertical.
- **RN-02:** O texto descritivo deve evidenciar a atuação direta dos sócios e a transparência de honorários.

---

## 7. Critérios de Aceitação (Testáveis)

## 8. Fora de Escopo e Riscos

- Animações complexas em 3D (mantidas animações CSS suaves de fade-in no scroll).

### Riscos
- N/A.

<script type="text/plain" id="spike-salescosta-prds-us-06-em-numeros">
# PRD — US-06: Em Números (Métricas de Autoridade)

> **Origem:** US-06 em [05-goals-and-not-goals.md](../05-goals-and-not-goals.md)  
> **Componente:** Componente 6 em [06-visual-layout.md](../06-visual-layout.md)  
> **Status:** Pronta para Desenvolvimento

---

## 1. Contexto e Problema

### 1.1 Contexto
Métricas numéricas de volume de clientes, anos de atuação e histórico de casos atuam como gatilho de prova social e autoridade instantânea para clientes em fase de avaliação.

### 1.2 Problema
Apresentar números estáticos e sem destaque visual perde a oportunidade de capturar o interesse do usuário durante a rolagem da página.

### 1.3 Persona Afetada
- Novos clientes e tomadores de decisão corporativos.

---

## 2. Objetivos

- **O01:** Exibir em destaque 4 indicadores consolidados da banca Sales Costa Advogados.
- **O02:** Animar a contagem numérica progressiva (0 ao alvo) quando a seção entrar na viewport do usuário.

---

## 3. Métricas de Sucesso

- **M01:** Execução da animação do contador em $100\%$ dos dispositivos compatíveis.
- **M02:** Aumento do tempo de permanência na página.

---

## 4. Solução Proposta

Desenvolvimento de um banner em fundo Off-White Quente (`#F8F6F4`) disposta em 4 colunas com divisores verticais sutis no desktop:
- `15` &nbsp;&nbsp; `+ ANOS DE EXPERIÊNCIA`
- `500` &nbsp;&nbsp; `+ CLIENTES ATENDIDOS`
- `300` &nbsp;&nbsp; `+ CASOS CONCLUÍDOS`
- `5` &nbsp;&nbsp; `ÁREAS DE ESPECIALIZAÇÃO`

---

## 5. Handoff de Design

- **Layout de Referência:** [sales-costa-layout-previa.png](../../images/sales-costa-layout-previa.png)
- **Componente Visual:** `images/components/06_numeros.png`
- **Esquema de Cores:** Fundo Off-White `#F8F6F4`, Números Dark `#2B2B2B`, Labels em caixa alta com `letter-spacing: 2px`.
- **Responsividade:** 4 colunas em linha no desktop; Grid 2x2 no mobile sem divisores verticais. Fonte ajustada via `clamp(2.5rem, 8vw, 4rem)`.

---

## 6. Regras de Negócio

- **RN-01:** A contagem animada deve ser disparada apenas uma única vez quando a seção entrar no campo de visão (via `IntersectionObserver`).
- **RN-02:** Em dispositivos com preferência por movimento reduzido (`prefers-reduced-motion: reduce`), o número final deve ser exibido estaticamente sem animação.

---

## 7. Critérios de Aceitação (Testáveis)

### CA-01: Animação do Contador Numérico
- **Dado** que a seção `#numeros` entra na tela do usuário,
- **Quando** o observador dispara o evento,
- **Então** os valores iniciam em 0 e incrementam suavemente até atingir 15, 500, 300 e 5 em ~2 segundos.

### CA-02: Disposição Grid 2x2 no Mobile
- **Dado** uma tela mobile com largura $< 768\text{px}$,
- **Quando** a seção é visualizada,
- **Então** as 4 métricas são organizadas em um grid de 2 linhas x 2 colunas.

---

## 8. Fora de Escopo e Riscos

### Fora de Escopo
- Atualização em tempo real via API dinâmica (valores estáticos definidos pelo escritório).

### Riscos
- N/A.

</script>

<script type="text/plain" id="spike-salescosta-prds-us-07-depoimentos-prova-social">
# PRD — US-07: Depoimentos (Prova Social & Validação de Clientes)

> **Origem:** US-07 em [05-goals-and-not-goals.md](../05-goals-and-not-goals.md)  
> **Componente:** Componente 7 em [06-visual-layout.md](../06-visual-layout.md)  
> **Status:** Pronta para Desenvolvimento

---

## 1. Contexto e Problema

### 1.1 Contexto
Depoimentos reais de executivos e diretores financeiros servem como validação de confiança, comprovando a capacidade técnica do escritório em casos societários e estratégicos de grande porte.

### 1.2 Problema
A ausência de depoimentos com nome, cargo e empresa identificada enfraquece a credibilidade da landing page frente a clientes corporativos exigentes.

### 1.3 Persona Afetada
- CFOs, diretores jurídicos e investidores avaliando a contratação do escritório.

---

## 2. Objetivos

- **O01:** Exibir depoimentos reais de clientes corporativos com destaque para a liderança técnica e agilidade do escritório.
- **O02:** Disponibilizar navegação simples por dots e suporte a gestos de deslizamento tátil (*touch swipe*) em celulares.

---

## 3. Métricas de Sucesso

- **M01:** Interação com o carousel de depoimentos $> 25\%$.
- **M02:** Aumento do índice de confiança na avaliação inicial do escritório.

---

## 4. Solução Proposta

Desenvolvimento de um módulo de citação em fundo Off-White Quente (`#F8F6F4`), exibindo aspas em tom Taupe no topo, a citação *"A equipe conduziu uma reestruturação societária complexa com clareza e agilidade que não encontrávamos em outros escritórios."*, a identificação de **Marina Albuquerque** (*Diretora Financeira, Grupo Vantis*) e os pontos de navegação (dots).

---

## 5. Handoff de Design

- **Layout de Referência:** [sales-costa-layout-previa.png](../../images/sales-costa-layout-previa.png)
- **Componente Visual:** `images/components/07_depoimentos.png`
- **Esquema de Cores:** Fundo Off-White `#F8F6F4`, Aspas Taupe `#AA9B8F`, Citação em itálico Dark `#2B2B2B`.
- **Responsividade:** Card centralizado; suporte a touch swipe em mobile; dots com alvo tátil $\ge 44\times 44\text{px}$.

---

## 6. Regras de Negócio

- **RN-01:** O depoimento deve exibir explicitamente a autoridade do autor (Nome, Cargo e Nome da Empresa).
- **RN-02:** Em smartphones, a transição entre depoimentos deve aceitar gestos laterais de deslizamento (*swipe*).

---

## 7. Critérios de Aceitação (Testáveis)

### CA-01: Exibição da Citação e Autor
- **Dado** que o visitante visualiza a seção de depoimentos,
- **Quando** o card é renderizado,
- **Então** a citação da reestruturação societária e a identificação de Marina Albuquerque (Grupo Vantis) são apresentadas.

### CA-02: Navegação por Gestos no Mobile
- **Dado** um usuário navegando em um smartphone,
- **Quando** ele desliza o dedo para a esquerda no card,
- **Então** o próximo depoimento do carousel é exibido.

---

## 8. Fora de Escopo e Riscos

### Fora de Escopo
- Vídeos de depoimento de clientes (mantido formato texto estático refinado).

### Riscos
- N/A.

</script>

<script type="text/plain" id="spike-salescosta-prds-us-08-nossa-equipe-socios">
# PRD — US-08: Nossa Equipe (Cards dos Sócios Responsáveis)

> **Origem:** US-08 em [05-goals-and-not-goals.md](../05-goals-and-not-goals.md)  
> **Componente:** Componente 8 em [06-visual-layout.md](../06-visual-layout.md)  
> **Status:** Pronta para Desenvolvimento

---

## 1. Contexto e Problema

### 1.1 Contexto
No meio jurídico corporativo, clientes contratam pessoas e reputações individuais. Apresentar os sócios fundadores e responsáveis por cada área reforça a transparência e a promessa de atendimento direto.

### 1.2 Problema
A ausência de fotos ou de apresentações claras da equipe gera sensação de obscuridade institucional e falta de pessoalidade no atendimento.

### 1.3 Persona Afetada
- Clientes corporativos, parceiros e potenciais contratantes de assessoria contínua.

---

## 2. Objetivos

- **O01:** Apresentar individualmente os 4 sócios da banca Sales Costa Advogados.
- **O02:** Disponibilizar avatares elegantes de iniciais (*AS*, *CC*, *FR*, *LM*) com suporte a substituição direta por fotografias reais de ensaio profissional.

---

## 3. Métricas de Sucesso

- **M01:** Identificação imediata da liderança responsável por cada área de atuação.
- **M02:** Transição transparente de avatares para fotos reais sem alteração na estrutura HTML/CSS.

---

## 4. Solução Proposta

Desenvolvimento da seção *"Nossa Equipe"* em fundo Branco Puro (`#FFFFFF`), com eyebrow `NOSSA EQUIPE`, H2 *"Os sócios responsáveis por cada caso."* e grid de 4 cards:
1. **Antônio Sales:** Sócio-fundador · Direito Empresarial | OAB/SP 000.000 (Avatar *AS*)
2. **Camila Costa:** Sócia-fundadora · Direito Tributário | OAB/SP 000.000 (Avatar *CC*)
3. **Felipe Ramos:** Sócio · Direito Trabalhista | OAB/SP 000.000 (Avatar *FR*)
4. **Luisa Martins:** Sócia · Societário & Compliance | OAB/SP 000.000 (Avatar *LM*)

---

## 5. Handoff de Design

- **Layout de Referência:** [sales-costa-layout-previa.png](../../images/sales-costa-layout-previa.png)
- **Componente Visual:** `images/components/08_equipe.png`
- **Esquema de Cores:** Fundo Branco `#FFFFFF`, Avatares em fundo Off-White `#F8F6F4` com iniciais em Taupe `#AA9B8F`.
- **Responsividade:** 4 colunas horizontais no desktop; Grid 2x2 no tablet; 1 coluna empilhada no mobile (< 768px). Proporção do avatar travada em `aspect-ratio: 1/1`.

---

## 6. Regras de Negócio

- **RN-01:** Os avatares de iniciais (*AS*, *CC*, *FR*, *LM*) devem ser centralizados sobre o container quadrado bege `#F8F6F4`.
- **RN-02:** Cada card deve exibir obrigatoriamente: Nome do Sócio, Cargo/Título, Área de Atuação e Registro OAB.

---

## 7. Critérios de Aceitação (Testáveis)

### CA-01: Exibição dos 4 Sócios
- **Dado** que o visitante navega até a seção `#equipe`,
- **Quando** a seção é renderizada,
- **Então** os 4 sócios (*Antônio Sales*, *Camila Costa*, *Felipe Ramos*, *Luisa Martins*) são exibidos com suas áreas e OAB.

### CA-02: Empilhamento 1 Coluna no Mobile
- **Dado** um smartphone (< 768px),
- **Quando** a seção é aberta,
- **Então** os cards da equipe são empilhados em 1 coluna sem distorção das caixas de avatar.

---

## 8. Fora de Escopo e Riscos

### Fora de Escopo
- Modais com biografia estendida ou currículo Lattes dos advogados (dados mantidos nos cards principais).

### Riscos
- **Risco:** Inscrições reais da OAB ainda constam como `OAB/SP 000.000`.
- **Mitigação:** Marcar como "Pergunta em aberto (não coberta por `spike-salescosta/`)" até o envio dos registros finais.

</script>

<script type="text/plain" id="spike-salescosta-prds-us-09-fale-conosco-formulario">
# PRD — US-09: Fale Conosco (Formulário de Contato & Informações)

> **Origem:** US-09 em [05-goals-and-not-goals.md](../05-goals-and-not-goals.md)  
> **Componente:** Componente 9 em [06-visual-layout.md](../06-visual-layout.md)  
> **Status:** Pronta para Desenvolvimento

---

## 1. Contexto e Problema

### 1.1 Contexto
O objetivo final da landing page é a conversão do visitante em um ponto de contato direto (*lead qualificado*), permitindo que potenciais clientes solicitem reuniões, façam tiragem de dúvidas ou iniciem processos de contratação.

### 1.2 Problema
Formulários com excesso de campos ou com estilização genérica reduzem drasticamente a taxa de conversão. Além disso, a ausência de telefones ou endereço físico gera desconfiança sobre a existência da sede do escritório.

### 1.3 Persona Afetada
- Diretores, empresários, executivos e clientes em busca de atendimento jurídico corporativo.

---

## 2. Objetivos

- **O01:** Disponibilizar formulário minimalista de contato com 5 campos essenciais (`Nome Completo`, `E-mail Corporativo`, `Telefone`, `Área de Interesse`, `Mensagem`).
- **O02:** Exibir claramente os dados da sede física (*Av. Paulista, 1000 — 12º andar, São Paulo/SP*), e-mail (*contato@salescosta.com.br*) e telefone de atendimento (*+55 11 3000-0000*).

---

## 3. Métricas de Sucesso

- **M01:** Taxa de conversão do formulário de contato $> 5\%$ dos visitantes totais.
- **M02:** Redução a zero de erros de validação por preenchimento incorreto.

---

## 4. Solução Proposta

Desenvolvimento da seção em fundo Dark Charcoal (`#404347`), com layout em 2 colunas:
- **Coluna Esquerda (Dados de Contato):** H2 *"Entre em contato com nossos advogados."*, subtítulo *"Respondemos em até um dia útil. Para casos urgentes, prefira o telefone."*, dados da sede na Av. Paulista, e-mail institucional, telefone e links de redes sociais.
- **Coluna Direita (Formulário):** Inputs minimalistas de linha sublinhada (`border-bottom`), seletor de áreas jurídicas e botão CTA *"Enviar mensagem →"*.

---

## 5. Handoff de Design

- **Layout de Referência:** [sales-costa-layout-previa.png](../../images/sales-costa-layout-previa.png)
- **Componente Visual:** `images/components/09_contato.png`
- **Esquema de Cores:** Fundo Dark `#404347`, Inputs transparentes com `border-bottom: 1px solid rgba(255,255,255,0.4)`, Botão Taupe `#AA9B8F`.
- **Prevenção de Zoom iOS:** Inputs e select configurados obrigatoriamente com `font-size: 16px` para impedir o zoom automático de tela no iOS Safari.
- **Responsividade:** 2 colunas no desktop; empilhado em 1 coluna no mobile (Dados no topo / Form abaixo; botão full width `100%`).

---

## 6. Regras de Negócio

- **RN-01:** Os campos `Nome Completo`, `E-mail Corporativo` e `Mensagem` são de preenchimento obrigatorio.
- **RN-02:** O campo `E-mail Corporativo` deve validar o formato de e-mail válido antes da submissão.
- **RN-03:** A seleção de `Área de Interesse` deve conter as 6 especialidades (*Empresarial*, *Tributário*, *Trabalhista*, *Civil*, *Societário*, *Compliance*).
- **RN-04:** O envio deve exibir mensagem de confirmação de recebimento ou redirecionar o usuário com feedback de sucesso.

---

## 7. Critérios de Aceitação (Testáveis)

### CA-01: Validação de Campos Obrigatórios
- **Dado** que o usuário tenta enviar o formulário sem preencher o e-mail,
- **Quando** o botão *"Enviar mensagem →"* é clicado,
- **Então** o navegador deve exibir a validação nativa de campo obrigatório e impedir a submissão.

### CA-02: Prevenção de Zoom Automático no Mobile
- **Dado** que o formulário é acessado através de um iPhone (iOS Safari),
- **Quando** o usuário clica no campo `Nome Completo`,
- **Então** o teclado virtual abre sem causar zoom ou deslocamento lateral na página (`font-size: 16px`).

---

## 8. Fora de Escopo e Riscos

### Fora de Escopo
- Desenvolvimento de backend próprio de e-mail (utilização de endpoint serverless terceirizado ou Formspree).

### Riscos
- **Risco:** Definição final do serviço de backend de envio de e-mail.
- **Mitigação:** Marcar como "Pergunta em aberto (não coberta por `spike-salescosta/`)" até definição da plataforma de e-mail corporativo.

</script>

<script type="text/plain" id="spike-salescosta-prds-us-10-rodape-institucional">
# PRD — US-10: Rodapé Institucional & Navegação Global

> **Origem:** US-10 em [05-goals-and-not-goals.md](../05-goals-and-not-goals.md)  
> **Componente:** Componente 10 em [06-visual-layout.md](../06-visual-layout.md)  
> **Status:** Pronta para Desenvolvimento

---

## 1. Contexto e Problema

### 1.1 Contexto
O rodapé fecha a navegação da landing page, oferecendo ao visitante que rolou até a base da página os links de acesso rápido às seções principais e o encerramento da identidade visual da banca.

### 1.2 Problema
Rodapés poluídos ou desalinhados em telefones celulares transmitem amadorismo e dificultam o retorno às seções superiores da página.

### 1.3 Persona Afetada
- Todos os visitantes da landing page.

---

## 2. Objetivos

- **O01:** Proporcionar fecho institucional elegante com a marca `SALES COSTA` e os links de atalho global (`Sobre`, `Áreas de atuação`, `Equipe`, `Contato`).
- **O02:** Garantir alinhamento automático em telas pequenas sem rolagem lateral.

---

## 3. Métricas de Sucesso

- **M01:** Taxa de retenção e navegação no rodapé.
- **M02:** Ausência total de erros de layout no encerramento da página.

---

## 4. Solução Proposta

Desenvolvimento do rodapé institucional em fundo Dark `#2B2D30`, posicionando a marca `SALES COSTA` em tom claro à esquerda e a lista de links navegáveis à direita.

---

## 5. Handoff de Design

- **Layout de Referência:** [sales-costa-layout-previa.png](../../images/sales-costa-layout-previa.png)
- **Componente Visual:** `images/components/10_rodape.png`
- **Esquema de Cores:** Fundo Dark Charcoal `#2B2D30`, Marca e Links em tom Taupe/Branco.
- **Responsividade:** Alinhado horizontalmente no desktop; alinhado verticalmente no mobile (< 768px) com alvos de clique táteis $\ge 44\text{px}$.

---

## 6. Regras de Negócio

- **RN-01:** Todos os links do rodapé devem acionar o scroll suave até as seções correspondentes na landing page.
- **RN-02:** O texto de copyright deve exibir o ano corrente e a titulação institucional.

---

## 7. Critérios de Aceitação (Testáveis)

### CA-01: Exibição da Marca e Links
- **Dado** que o usuário atinge o fim da página,
- **Quando** o rodapé é renderizado,
- **Então** a marca `SALES COSTA` e os links da nav são exibidos.

### CA-02: Navegação Suave pelas Âncoras
- **Dado** que o usuário clica no link *"Equipe"* no rodapé,
- **Quando** o clique ocorre,
- **Então** a página rola suavemente até a seção `#equipe`.

---

## 8. Fora de Escopo e Riscos

### Fora de Escopo
- Links para páginas internas secundárias (toda a estrutura é concentrada na landing page single-page).

### Riscos
- N/A.

</script>

al.md"}, {"id": "spike-salescosta-prds-us-08-nossa-equipe-socios", "title": "PRD · US-08 Nossa Equipe", "path": "spike-salescosta/PRDs/US-08-nossa-equipe-socios.md"}, {"id": "spike-salescosta-prds-us-09-fale-conosco-formulario", "title": "PRD · US-09 Fale Conosco", "path": "spike-salescosta/PRDs/US-09-fale-conosco-formulario.md"}, {"id": "spike-salescosta-prds-us-10-rodape-institucional", "title": "PRD · US-10 Rodapé Institucional", "path": "spike-salescosta/PRDs/US-10-rodape-institucional.md"}]}];

let mermaidReady = false;

function renderMermaid(){
  if(!mermaidReady) return;
  const nodes = document.querySelectorAll('#doc .mermaid:not([data-done])');
  if(!nodes.length) return;
  nodes.forEach(n => n.setAttribute('data-done','1'));
  window.mermaid.run({ nodes: [...nodes] });

function show(id){
  const idx = FLAT.findIndex(x => x.id === id);
  const item = idx >= 0 ? FLAT[idx] : FLAT[0];
  const docEl = document.getElementById('doc');

  const raw = document.getElementById(item.id).textContent;
  docEl.innerHTML = render(raw);
  if (!MD_OK) docEl.querySelector('pre').textContent = raw;

  docEl.querySelectorAll('pre > code.language-mermaid').forEach(code => {
    const d = document.createElement('div');
    d.className = 'mermaid';
    d.textContent = code.textContent;
    code.parentElement.replaceWith(d);
  });

  docEl.querySelectorAll('table').forEach(t => {
    const w = document.createElement('div'); w.className = 'tablewrap';
    t.replaceWith(w); w.appendChild(t);
  });

  document.getElementById('crumb').textContent = item.path;
  document.querySelectorAll('#nav a').forEach(a =>
    a.classList.toggle('active', a.dataset.id === item.id));

  const i = FLAT.indexOf(item);

  if(i < FLAT.length-1){ next.href = '#' + FLAT[i+1].id; next.textContent = FLAT[i+1].title + ' →'; }

  document.title = item.title.replace(/^[\d\s·]+/, '') + ' · Spike';
  window.scrollTo(0, 0);
  document.getElementById('side').classList.add('collapsed');
  renderMermaid();
}

});
